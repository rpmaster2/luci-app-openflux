name: build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build ipk
        run: python3 build-ipk.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-openflux-ipk
          path: dist/*.ipk

      - name: Attach ipk to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
