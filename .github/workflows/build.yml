name: build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build ipk
        run: python3 build-ipk.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-openflux-ipk
          path: dist/*.ipk
